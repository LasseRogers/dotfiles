name: CI

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # shellcheck is preinstalled on the runner; stow is not.
      - run: sudo apt-get install -y stow
      - run: shellcheck -x install.sh install/*.sh tests/*.sh bash/.config/bash/rc.sh
      - run: tests/link.sh

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check nvim
